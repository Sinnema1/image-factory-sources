apiVersion: image.example/v1alpha1
kind: ImageRecipe
metadata:
  name: windows-vm
  version: "0.0.1"
  baselineClassification: slim-vdi-base
target:
  platform: windows
  release: "11"
  architecture: amd64
  imageType: vm
defaults:
  failurePolicy: fail
packages:
  - name: putty
    version: 0.83.0
    installOrder: 10
  # - name: vscode
  #   version: "1.135.0"
  #   installOrder: 30
  - name: firefox
    version: 156.0.1
    installOrder: 20

  
