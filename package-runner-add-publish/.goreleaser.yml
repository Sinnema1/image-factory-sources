#yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

archives:
  - formats: ['binary']
    ids: [ package-runner ]
builds:
  - id: package-runner
    binary: package-runner
    env:
    - CGO_ENABLED=0
    flags:
    - -trimpath
    targets:
    - "darwin_arm64"
    - "windows_amd64"
    - "linux_amd64"
    - "linux_arm64"
    mod_timestamp: "{{ .CommitTimestamp }}"
    main: ./cmd/package-runner

publishers:
  - name: artifacts
    cmd: >
      ./publish_cli.sh {{ .Env.PUB_CLI_VERSION }} {{ .Env.GORELEASER_BUILD_DIR }} /mnt/image-factory/artifacts

changelog:
  disable: true

release:
  disable: true





